[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-investment-committee"
version = "0.1.0"
description = "Multi-agent equity research system with debate-driven investment workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "tiktoken>=0.7.0",
]

[project.scripts]
investment-committee = "cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio"]
